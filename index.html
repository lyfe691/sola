    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Pre-paint theme stamp: keeps dark themes from flashing white (and
         the 250ms color transition from animating the correction) while
         React boots. Mirrors theme-provider.tsx, which remains the source
         of truth: it re-stamps on mount and persists the resolved scheme
         under "vite-ui-scheme" for this script to read. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem("vite-ui-theme");
          /* first visit and cleared storage both land on the welcome
             preset's theme, which is "system" */
          if (!theme) theme = "system";
          var scheme = localStorage.getItem("vite-ui-scheme");
          if (theme === "system")
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          if (!scheme) scheme = theme === "dark" ? "dark" : "light";
          root.classList.add(theme);
          root.dataset.scheme = scheme;
        } catch (e) {
          /* storage unavailable — first paint stays on the default theme */
        }
        /* browser-chrome color follows the resolved scheme; values mirror
           --background in light and dark (src/index.css) */
        var meta = document.createElement("meta");
        meta.name = "theme-color";
        meta.content = root.dataset.scheme === "dark" ? "#0a0a0a" : "#ffffff";
        document.head.appendChild(meta);
      })();
    </script>

    <!-- =====================================
         PRIMARY META TAGS
         This file is the home page's head. On build, vite/seo-pages.ts writes
         a copy per page with its own title, description, canonical, Open
         Graph and Twitter tags, because link scrapers never run the app.
         Every tag it rewrites must stay here.
         data-react-managed marks tags owned by the boot sequence. The title
         is mutated in place by DocumentTitle (imperative document.title).
         The description, canonical and url tags cover the pre-boot window and
         raw-HTML crawlers; main.tsx removes each as soon as a page hoists its
         own twin via React 19 native metadata, which does not dedupe against
         static tags.
    ====================================== -->

      Yanis Sebastian Zürcher • Software Developer in Zürich
    </title>
